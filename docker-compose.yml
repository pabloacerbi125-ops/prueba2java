version: "3.9"

services:
  eureka:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: prueba2java-eureka:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=eureka-server
      - SERVER_PORT=8761
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: prueba2java-auth:latest
    container_name: auth-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=auth-service
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    container_name: project-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_APPLICATION_NAME=project-service
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=project-service
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    image: prueba2java-resource:latest
    container_name: resource-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_APPLICATION_NAME=resource-service
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=resource-service
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy

  collab-service:
    build:
      context: .
      dockerfile: collab-service/Dockerfile
    image: prueba2java-collab:latest
    container_name: collab-service
    ports:
      - "8084:8080"
    environment:
      - SPRING_APPLICATION_NAME=collab-service
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=collab-service
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: prueba2java-api:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy

networks:
  microservices-network:
    driver: bridge
