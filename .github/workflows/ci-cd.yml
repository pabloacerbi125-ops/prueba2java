name: Innovatech CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- FASE 1: COMPILACIÓN JAVA (Tu código) ---
      - name: 📥 Checkout del código
        uses: actions/checkout@v3

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: 🚀 Compilar microservicios con Maven
        run: mvn clean package -DskipTests

      # --- FASE 2: DOCKER HUB ---
      - name: 🐳 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build y push de imágenes
        # Aquí construyes y subes las imágenes. El punto (.) indica que use la raíz del proyecto para el contexto.
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-api:latest -f api-gateway/Dockerfile .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-project:latest -f project-service/Dockerfile .

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-project:latest

          # Repite estas líneas para auth-service, resource-service, etc., según necesites actualizar.

      # --- FASE 3: DESPLIEGUE EN AWS SWARM ---
      - name: ☁️ Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔄 Desplegar en Swarm vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar microservicios en Swarm" \
            --parameters '{"commands":[
              "set -e",
              
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-api:latest",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-project:latest",
              
              "docker service update --image ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-api:latest innovatech-stack_api-gateway",
              "docker service update --image ${{ secrets.DOCKERHUB_USERNAME }}/prueba2java-project:latest innovatech-stack_project-service"
            ]}' \
            --output text
