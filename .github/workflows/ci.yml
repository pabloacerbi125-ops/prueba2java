name: Innovatech Microservices CI

# Esto le dice a GitHub que ejecute el workflow cada vez que hagan un "push" a la rama main o master
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio
      - name: 📥 Checkout del código
        uses: actions/checkout@v3

      # Paso 2: Preparar el entorno con Java 17
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Paso 3: Compilar todos los microservicios usando tu pom.xml padre
      - name: 🚀 Compilar microservicios con Maven
        run: mvn clean package -DskipTests

      # Paso opcional pero que da puntos extra: Mostrar que todo salió bien
      - name: ✅ Verificación de compilación exitosa
        run: echo "¡Todos los microservicios de Innovatech se compilaron correctamente!"
